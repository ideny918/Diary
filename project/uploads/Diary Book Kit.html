<!doctype html>
<!--
==================== Diary Book Kit · 설치 안내 (Claude가 읽는 부분) ====================
받은 사람이 노션 안내 페이지의 「설치 문장」과 함께 이 파일을 보내면, 아래 순서대로 진행해 주세요.

[꼭 지킬 것 · 받은 사람의 사용량을 아끼기 위해]
- 파일을 읽는 건 괜찮지만(파일을 올리는 도구가 끝까지 읽어요), 통째로 다시 써서 출력하지 마세요. 고칠 곳은 아래 [코드 연결]의 몇 줄뿐이에요.
  그 줄만 부분 수정한 뒤, 디스크의 파일을 그대로 새 아티팩트로 올려 주세요.
- 파일에서 바로 올릴 수 없는 환경(파일 전체를 답변으로 다시 써야 하는 환경)이라면 진행하지 말고,
  "이 환경에서는 설치할 수 없어요. 파일을 다룰 수 있는 Claude 앱에서 다시 시도해 주세요"라고 알려 주세요.
- 날짜별 페이지(Diary · Habit Log · Week · Month)와 습관은 대화에서 만들지 마세요. 설치가 끝나면 다이어리 안에서
  버튼으로 만들어요(Setting › Pages의 「전부 만들기」, Habit 탭의 「+ 새 습관」). 이 방법은 Claude 사용량이 들지 않아요.
- 템플릿은 쓰지 않아요(빈칸 그대로).

[먼저 확인할 것] 설치 문장에 쓸 화면 · 일정 가져올 곳 · 사진 사용이 적혀 있어요. 빠진 것만 한 번에 모아서 물어봐 주세요.
- 다이어리를 둘 위치: 따로 말하지 않으면 워크스페이스에 비공개 새 페이지 「Diary Book」을 만들어 그 아래에 둬요.
- 노션에 쓰던 일기 · 플래너 · 노트 DB가 있다면 아래 [이미 쓰는 DB가 있을 때]를 따라요.
- Notes 세부태그와 습관 카테고리는 기본값(CATS · HCATS)으로 시작해요.

[설치 순서] 노션에 만들기 전에 아래 ①~③ 목록을 한 번에 보여 주고 승인받아요.
① 부모 페이지 「Diary Book」(비공개)을 만들어요(사용자가 정한 페이지가 있으면 그 아래).
② 고른 화면에 필요한 DB만 그 페이지 안에 만들어요. Day는 항상 포함이에요.
   Day → Diary · Year/Month/Week 중 하나라도 → Planner · Notes → Notes · Habit → Habits · Habit Log
③ DB마다 저장된 뷰 「Diary Book」을 만들어요(notion-create-view, 표 보기, 필터 없음, 속성 숨기지 않기).
   정렬: Diary · Planner · Notes · Habit Log = Date 내림차순, Habits = Order 오름차순.
④ 아래 [코드 연결]대로 파일을 고쳐 아티팩트로 올리고 권한을 선언해요.
날짜별 페이지와 습관은 만들지 않아요. 고르지 않은 화면의 DB는 만들지 말고 NOTION의 그 칸은 빈칸으로 둬요.

[노션 구성] 속성 이름과 종류를 똑같이. 제목 속성 이름도 정확히 맞춰 주세요(노션 기본값 「Name」과 다를 수 있어요).
- Diary (하루 1페이지): Title(제목), Date(날짜), Log · Event · To do · Morning Note · Joy · Reset · Tomorrow ·
  Sleep Journal · Comment · Wake Up · In Bed(모두 텍스트).
- Planner (주·월마다 1페이지): Title(제목), Date(날짜), Category(선택: Week · Month), Goal · Period Log · Comment(텍스트).
- Notes (노트마다 1페이지): Name(제목), Date(날짜), 세부태그(선택, 선택지는 CATS의 태그), On(체크박스).
- Habits (습관마다 1페이지): Name(제목), Icon(텍스트, 이모지 하나), Category(선택, 선택지는 HCATS), Order(숫자), On(체크박스), Start(날짜).
- Habit Log (하루 1페이지): Title(제목), Date(날짜). 습관마다 「이름」(체크박스 = 달성)과 「이름 절반」(선택, 선택지 「절반」) 두 칸이
  다이어리에서 습관을 추가할 때 자동으로 생겨요. 습관 이름을 노션에서 바꾸면 이 두 칸 이름도 함께 바꿔야 이어져요.

[이미 쓰는 DB가 있을 때]
- 속성 이름이 코드 여러 곳에 들어 있어서, 이름이 다른 DB에 코드를 맞추려면 많이 고쳐야 해요. 새로 만들어 쓰기를 먼저 권해 주세요.
- 그래도 기존 DB를 쓰겠다면: 코드는 그대로 두고, 승인을 받은 뒤 기존 DB의 속성 이름 · 종류를 위 구성에 맞게 바꾸거나 추가해요.
  속성이나 페이지를 지우거나 기존 값을 덮어쓰지 말고, 바꿀 목록을 먼저 보여 주세요.
- Date가 비어 있는 기존 기록은 다이어리에 보이지 않고, 본문에 이미지 · 표가 있는 페이지는 다이어리에서 본문을 고칠 수 없다고 알려 주세요.

[코드 연결] 고칠 곳은 이것뿐이에요(검색해서 그 줄만).
0) 「const KIT={」: tabs = 고른 화면(year · month · week · day · notes · habit 중), events = "gcal"(구글 캘린더) 또는 "notion",
   photos = true / false.
1) 「const NOTION={」: diary · planner · notes · habits · hlog마다 view = 저장된 뷰 「Diary Book」의 URL(노션 도구가 돌려준 형태 그대로),
   ds = 데이터 소스 ID(collection:// 은 있어도 없어도 돼요). 템플릿 칸과 goals는 빈칸.
   view가 채워지면 설치 전 안내가 사라지고 실제 노션을 읽어요. 채운 뒤 각 view로 notion-query-data-sources(mode "view")를 한 번씩 불러 확인해요.
2) 커넥터 이름: 이 사람의 노션 · 구글 캘린더 커넥터 이름이 기본값과 다르면 NOTION.server(기본 "Notion")와
   「const GSERVER=」(기본 "Google Calendar")를 그 이름으로. 구글 캘린더가 없으면 고칠 필요 없어요(다이어리가 알아서 노션 일정 칸을 써요).
3) capabilities(아티팩트를 올린 뒤 선언):
   mcp — Notion: notion-query-data-sources, notion-fetch, notion-update-page, notion-create-pages, notion-update-data-source
         (습관을 안 쓰면 notion-update-data-source는 빼도 돼요)
         Google Calendar(events가 "gcal"일 때만): list_calendars, list_events, create_event, update_event, delete_event
   photos가 true일 때만 assets · db · user도.
4) 끝나면 이렇게 알려 주세요:
   ① 다이어리를 열고 노션(· 구글 캘린더) 허용 창에서 「허용」
   ② Setting › Pages의 「전부 만들기」로 페이지 만들기(몇 분 걸려요)
   ③ (Habit을 골랐다면) Habit 탭의 「+ 새 습관」으로 습관 추가
   ④ Day에 한 줄 쓰고 「노션에 저장」

[설치 후] 나중에 화면을 켜거나 끄고 싶다고 하면: 필요한 DB만 만들고(또는 그대로 두고) KIT · NOTION 줄만 고쳐요.
이 다이어리는 각자 고쳐 쓰는 기초 파일이에요. 사용자가 칸 · 화면 · 디자인을 바꿔 달라고 하면 지금 아티팩트에서
필요한 부분만 고쳐 다시 올려 주세요(새 아티팩트를 만들면 올린 사진과 화면 설정이 옮겨지지 않아요).
==========================================================================================
-->
<html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Diary Book Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: an open notebook on a desk. Landscape shows a two-page spread; portrait or narrow screens show one page at a time.
   Every spread fits the screen, so nothing scrolls vertically: long lists continue on the next spread. */
:root{
  --desk:#e7e8eb; --bg:#ffffff; --ink:#000000; --line:#000000; --soft:rgba(0,0,0,.52); --faint:rgba(0,0,0,.13); --wash:#f5f5f6;
  --point:#000000;
  --f:"Avenir Next","Avenir","Apple SD Gothic Neo","Helvetica Neue",Arial,sans-serif;
  --hair:1px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;background:var(--desk);color:var(--ink)}
body{font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
textarea,input{font:inherit;color:var(--ink)}

.desk{height:100%;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);place-items:center;padding-block:14px}
.book{position:relative;height:100%;max-height:900px;width:calc(100% - 40px);max-width:1400px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);touch-action:pan-y}
.page{position:relative;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:22px 28px 14px;min-width:0;min-height:0;overflow:hidden}
.page.l{border-radius:6px 0 0 6px;box-shadow:-1px 1px 0 var(--faint),-6px 8px 24px rgba(0,0,0,.08)}
.page.r{border-radius:0 6px 6px 0;box-shadow:1px 1px 0 var(--faint),6px 8px 24px rgba(0,0,0,.08)}
.page.l::after,.page.r::before{content:"";position:absolute;top:0;bottom:0;width:28px;pointer-events:none}
.page.l::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.07),rgba(0,0,0,0))}
.page.r::before{left:0;background:linear-gradient(to right,rgba(0,0,0,.07),rgba(0,0,0,0))}
.ph{display:flex;align-items:baseline;gap:12px;min-height:40px;border-bottom:1px solid var(--line);padding-bottom:8px}
.ph h1{margin:0;font-size:28px;font-weight:700;line-height:1;letter-spacing:-.01em}
.ph .sub{font-size:13px;font-weight:300;color:var(--soft);letter-spacing:.06em}
.ph .sp{margin-left:auto}
.ph .nav{align-self:center}
.pb{min-height:0;padding-top:12px;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.pf{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.14em;color:var(--soft);padding-top:8px;min-height:21px;height:21px;box-sizing:border-box;text-transform:uppercase;font-variant-numeric:tabular-nums}
.nav{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.06em}
.nav .ar{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;line-height:1;padding:4px 2px}
.nav .ar:hover span{text-decoration:underline;text-underline-offset:3px}
.nav .navbar{width:var(--hair);height:12px;background:var(--ink);opacity:.7}
.nav .nowb{font-size:11px;letter-spacing:.06em;color:var(--soft);padding:4px 2px}
.nav .nowb:hover{color:var(--ink)}
.vslot{display:inline-flex;align-items:center;min-width:22px;align-self:center}
.mode-btn{width:22px;height:22px;display:inline-grid;place-items:center;border:0;color:var(--ink)}
.seg2{display:flex;border:var(--hair) solid var(--line)}
.seg2 button{padding:4px 14px;font-size:12.5px}
.seg2 button[aria-pressed="true"]{background:var(--point);color:var(--bg)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:var(--hair) solid var(--faint)}
.label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.muted{color:var(--soft);font-size:12.5px}

/* index tabs on the book's outer edge */
.tabs{position:absolute;right:-30px;top:40px;bottom:28px;display:flex;flex-direction:column;gap:4px;z-index:5}
.tabs button{writing-mode:vertical-rl;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:var(--bg);border:var(--hair) solid var(--faint);border-left:0;padding:0;width:28px;height:78px;flex:0 1 78px;min-height:40px;display:grid;place-items:center;border-radius:0 5px 5px 0;color:var(--soft);box-shadow:3px 2px 8px rgba(0,0,0,.05)}
.tabs button[aria-pressed="true"]{background:var(--point);color:var(--bg);border-color:var(--point)}
.tabs .help-tab{margin-top:auto;height:34px}
.tabs .set-tab{height:64px;margin-top:auto}
.tabs .today-tab{width:28px;height:26px;background:var(--point);border-color:var(--point);margin:-30px 0 10px}
.tabs .today-tab:hover{opacity:.8}
.tabs .today-tab{flex:none;min-height:0}

/* month spread */
.mgrid{display:grid;min-height:0;border-top:var(--hair) solid var(--line);border-left:var(--hair) solid var(--line)}
.mgrid > *{border-right:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line);min-width:0;min-height:0}
.mdow{display:grid;font-size:10px;letter-spacing:.16em;font-weight:500;text-align:center;padding-bottom:6px}
.mcell{position:relative;text-align:left;padding:5px 6px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;container-type:size}
.mcell.out{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--wash) 6px 7px)}
.mcell .n{font-size:11px;font-variant-numeric:tabular-nums}
.mcell.today{background:color-mix(in srgb,var(--point) 5%,var(--bg))}
.mcell.today .n{text-decoration:underline;text-decoration-color:var(--point);text-decoration-thickness:1.5px;text-underline-offset:3px;font-weight:600}
.mcell .n{justify-self:start;padding:0 2px}
.mcell.ph .mimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mcell.ph .n{position:relative;z-index:2}
.mcell.ph .phup{z-index:1}
.mcell.hasph .n{color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6),0 0 1px rgba(0,0,0,.7)}
.mcell.hasph.today .n{text-decoration-color:#fff}
.mcell.ph .phslot svg{width:22px;height:22px}
.mcell.ph:hover{background:var(--wash)}
.mcell .n:hover{text-decoration:underline}
.mta{width:100%;height:100%;border:0;background:transparent;resize:none;font-size:11.5px;line-height:1.4;padding:2px 2px 0;min-height:0;overflow:auto;white-space:pre-wrap}
.mta:focus{outline:none;background:color-mix(in srgb,var(--point) 4%,var(--bg))}
.mcell.dirty::after{content:"";position:absolute;top:8px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--point)}
.wkl{writing-mode:vertical-rl;font-size:8.5px;letter-spacing:.14em;font-weight:500;display:grid;place-items:center;color:var(--ink)}
.wkl:hover{background:var(--wash)}
.mside{display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding:6px 10px 8px;overflow:hidden}
.mside .gi{min-height:22px;grid-template-columns:12px minmax(0,1fr) 12px;gap:6px}
.mside .gi input[type=checkbox]{width:11px;height:11px}
.mside .gi .gt{font-size:11.5px;padding:1px 0}
.mside .gi .gx{font-size:12px}
.mside .fld textarea{font-size:11.5px;line-height:1.5}

/* week spread */
.wcol{display:grid;grid-auto-rows:minmax(0,1fr);min-height:0;margin-top:-12px}
.wbox{border-bottom:var(--hair) solid var(--line);padding:8px 2px 6px;grid-template-rows:minmax(0,1fr);display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;text-align:left;min-height:0;overflow:hidden}
.wbox .d{align-self:start;text-align:left;padding:0}
.wbox .d:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.wbox .c{grid-template-rows:auto minmax(0,1fr) auto}
.wta{width:100%;height:100%;min-height:0;border:0;background:transparent;resize:none;font-size:12px;line-height:1.5;padding:0;overflow:auto;white-space:pre-wrap}
.wta:focus{outline:none;background:color-mix(in srgb,var(--point) 4%,var(--bg))}
.wn{display:flex;flex-wrap:wrap;gap:2px 10px}
.wn button{font-size:11.5px;color:var(--soft);text-align:left;padding:0}
.wn button:hover{color:var(--ink);text-decoration:underline}
.wbox{position:relative}
.wbox.dirty::after{content:"";position:absolute;top:10px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--point)}
.wbox .d b{display:block;font-size:18px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.wbox .d span{font-size:10px;letter-spacing:.16em;color:var(--soft)}
.wbox.today .d b{color:var(--point);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.wbox .c{min-width:0;overflow:auto;max-height:100%;display:grid;align-content:start;gap:2px;font-size:12px;line-height:1.5}
.wbox .gi{min-height:24px}
.wbox .gi .gt{font-size:12px;padding:2px 0}
.wbox .ev{color:var(--soft);white-space:pre-line}
.wbox .lg{white-space:pre-line}
.wbox.goals{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.wbox.goals > div:first-child{padding-right:14px}
.wpl{display:grid;grid-template-rows:auto minmax(0,1fr);gap:4px;min-height:0;border-left:var(--hair) solid var(--faint);padding-left:14px}
.wbox:has(.wph){grid-template-columns:52px minmax(0,1fr) auto;container-type:size}
.wbox .wph{width:calc(100cqh + 14px);height:calc(100cqh + 14px);margin:-8px 0 -6px;align-self:start}
.wph{border:0;min-height:0}
.wcol.dense{grid-template-rows:minmax(0,2fr) repeat(7,minmax(0,1fr));grid-auto-rows:unset}
.wcol.dense .wbox.goals{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.wcol.dense .wbox{grid-template-columns:44px minmax(0,1fr);gap:10px;padding:5px 2px 4px}
.wcol.dense .wbox .d b{font-size:17px}
.wcol.dense .wbox .d span{font-size:9px}
.wcol.dense .wbox .c{font-size:12px;line-height:1.45}
.wcol.dense .gi{min-height:26px}
.phgrid{display:grid;gap:10px;min-height:0;align-content:stretch}
.phbox{border:var(--hair) dashed var(--faint);display:grid;place-items:center;align-content:center;gap:4px;color:var(--soft);font-size:10.5px;letter-spacing:.14em;min-height:0;text-align:center}
.phbox svg{width:20px;height:20px;color:var(--faint)}
.phnote{font-size:11.5px;color:var(--soft);text-align:center;margin:6px 0 0}

/* goal checklist */
.glist{display:grid;align-content:start;overflow:auto;min-height:0}
.gi{display:grid;grid-template-columns:16px minmax(0,1fr) 16px;gap:8px;align-items:center;border-bottom:var(--hair) solid var(--faint);min-height:27px}
.gi input[type=checkbox]{appearance:none;-webkit-appearance:none;width:13px;height:13px;margin:0;border:1px solid var(--ink);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.gi input[type=checkbox]:checked{background:var(--point)}
.gi input[type=checkbox]:checked::after{content:"";width:6px;height:3px;border-left:1.5px solid var(--bg);border-bottom:1.5px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.gi .gt{border:0;background:transparent;font-size:13px;padding:3px 0;width:100%;min-width:0}
.gi .gt:focus{outline:none}
.gi textarea.gt{display:block;resize:none;overflow:hidden;font-family:inherit;color:inherit;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;height:auto;box-sizing:border-box}
.glist:has(textarea.gt){grid-auto-rows:max-content}
.gi:has(> textarea.gt){align-items:start}
.gi:has(> textarea.gt) > input[type=checkbox]{margin-top:5.5px}
.wbox .gi:has(> textarea.gt) > input[type=checkbox],.glist.sm .gi:has(> textarea.gt) > input[type=checkbox]{margin-top:4px}
.mside .gi:has(> textarea.gt) > input[type=checkbox]{margin-top:3.5px}
.gi:has(> textarea.gt) > .gx{align-self:start;line-height:1.4}
.glist.sm{gap:0;align-content:start}
.glist.sm .gi{grid-template-columns:11px minmax(0,1fr) 12px;gap:5px;min-height:20px;border-bottom:0}
.glist.sm .gi input[type=checkbox]{width:10px;height:10px}
.glist.sm .gi input[type=checkbox]:checked::after{width:5px;height:2.5px}
.glist.sm .gt{font-size:11.5px;padding:1px 0}
.glist.sm .gx{font-size:10px;opacity:0}
.glist.sm .gi:hover .gx,.glist.sm .gi:focus-within .gx{opacity:.5}
.glist.sm .add .plus{font-size:10px}
.gi.done .gt{color:var(--soft);text-decoration:line-through;text-decoration-thickness:1px}
.gi .gx{color:var(--soft);font-size:15px;opacity:.45}
.gi.add{border-bottom:0}
.gi .plus{color:var(--soft);text-align:center}

/* day spread */
.dgrid{display:grid;gap:0;min-height:0}
.fld{display:grid;grid-template-rows:auto minmax(0,1fr);gap:2px;border-bottom:var(--hair) solid var(--faint);padding:8px 0 4px;min-height:0}
.fld.sec{border-bottom:1px solid var(--line)}
.drow2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;min-height:0;border-bottom:1px solid var(--line)}
.drow2 > .fld{border-bottom:0}
.dcol{display:flex;flex-direction:column;min-height:0}
.dcol > .fld:last-child{border-bottom:0}
.dnrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;min-height:0;padding:8px 0;border-bottom:1px solid var(--line)}
.dnb{display:grid;grid-template-rows:auto minmax(0,1fr);gap:4px;min-height:0}
.dph{height:100%;aspect-ratio:1/1;border:var(--hair) dashed var(--faint);display:grid;place-items:center;color:var(--faint)}
.dph svg{width:20px;height:20px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;min-height:0;border-bottom:var(--hair) solid var(--faint)}
.frow .fld{border-bottom:0}
.fld label{display:flex;gap:6px;align-items:center}
.fld textarea{width:100%;height:100%;resize:none;border:0;background:transparent;font-size:13px;line-height:1.6;padding:0;min-height:0;overflow:auto}
.fld textarea:focus{outline:none}
.fld textarea::placeholder{color:var(--faint)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--point)}
.sleeprow{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center;padding:0 0 7px;border-bottom:var(--hair) solid var(--faint)}
.sleeprow .sc{display:flex;align-items:center;gap:8px}
.sleeprow .lh{display:flex;gap:6px;align-items:center}
.sleeprow input,.sleeprow .hrs{width:4.2em;border:0;background:transparent;font-size:13px;line-height:20px;height:22px;font-variant-numeric:tabular-nums;padding:2px 0;margin:0}
.sleeprow .hrs{border-bottom-color:transparent;width:auto}
.slp{font-size:11.5px;line-height:1;padding:4px 9px;border:var(--hair) solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums;margin-left:-10px}
.slp:empty{display:none}
.dtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;min-height:0;container-type:size;border-bottom:1px solid var(--line)}
.dtl{display:flex;flex-direction:column;min-height:0}
.dtl > .fld:last-child{border-bottom:0}
.dtop .dph{width:calc(100cqh - 16px);height:calc(100cqh - 16px);align-self:center;aspect-ratio:auto}
.sleeprow input:focus{outline:none;background:color-mix(in srgb,var(--point) 4%,var(--bg))}
.logrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;border-bottom:1px solid var(--line);min-height:0}
.logrow .fld{border-bottom:0}
.logph{padding:8px 0 8px;display:grid;min-height:0}
.dnotes{display:grid;align-content:start;gap:2px;overflow:auto;padding-top:6px}
.dnotes button{text-align:left;font-size:12.5px;padding:2px 0}
.ph .phbtn{align-self:center;padding:2px 9px;font-size:11.5px;line-height:1.2;margin:-6px 0}
.nplus{font-size:13px;line-height:1;color:var(--soft);padding:0 4px}
.nplus:hover{color:var(--ink)}
.nnform{display:grid;gap:12px;margin-bottom:14px}
.nnin{border:0;border-bottom:1px solid var(--line);font-size:18px;padding:6px 0;background:transparent;width:100%}
.nnin:focus{outline:none}
.nnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nnsel{font:inherit;font-size:13px;padding:4px 6px;border:var(--hair) solid var(--line);background:var(--bg);color:var(--ink)}

/* year spread */
.ygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));grid-auto-flow:column;border-top:var(--hair) solid var(--line);border-left:var(--hair) solid var(--line);min-height:0}
.ycard{border-right:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line);text-align:left;padding:10px 12px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;overflow:hidden;min-height:0}
.ycard{position:relative}
.ymn{text-align:left}
.ycard .mk-one{font-size:10.5px;padding:2px 7px;margin-left:4px}
.ymn:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.yta{width:100%;height:100%;border:0;background:transparent;resize:none;font-size:12px;line-height:1.6;padding:0;min-height:0;overflow:auto;white-space:pre-wrap}
.yta:focus{outline:none;background:color-mix(in srgb,var(--point) 4%,var(--bg))}
.ycard.dirty::after{content:"";position:absolute;top:14px;right:38px;width:5px;height:5px;border-radius:50%;background:var(--point)}
.ycard .yl .glist{white-space:normal}
.ycard .yh{display:flex;justify-content:space-between;align-items:baseline}
.ycard .yh b{font-size:15px;font-weight:700}
.ycard .yh span{font-size:10px;letter-spacing:.14em;color:var(--soft)}
.ycard.now .yh b{text-decoration:underline;text-decoration-color:var(--point);text-underline-offset:4px}
.ycard .yl{font-size:12px;line-height:1.6;white-space:pre-line;overflow:auto;min-height:0}
.yg{display:grid;grid-template-columns:9px minmax(0,1fr);gap:7px;align-items:baseline}
.ybox{width:8px;height:8px;border:1px solid var(--ink);display:inline-block}
.yg.done .ybox{background:var(--point);border-color:var(--point)}
.yg.done span:last-child{color:var(--soft);text-decoration:line-through}
.mode-btn{color:var(--soft);display:inline-flex}
.mode-btn:hover{color:var(--ink)}

/* notes spread */
.nrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:baseline;height:var(--rowh);border-bottom:var(--hair) solid var(--faint);text-align:left;width:100%;overflow:hidden}
.nrow .nd{font-size:10.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.nrow .nt{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .tg{font-size:10.5px;color:var(--soft);white-space:nowrap}
.nhead{height:var(--rowh);display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px}
.nhead b{font-size:15px;font-weight:700}
.nhead span{font-size:11px;color:var(--soft)}
.nsub{height:var(--rowh);display:flex;align-items:flex-end;font-size:11px;letter-spacing:.06em;color:var(--soft);padding-bottom:4px;border-bottom:var(--hair) solid var(--faint)}
.ontg{font-size:8px;font-weight:700;letter-spacing:.1em;line-height:1;padding:3px 4px 2.5px;border:1px solid var(--faint);color:var(--soft)}
.ontg.on{border-color:var(--point);color:var(--bg);background:var(--point)}
.ontg.dirty{outline:1px dashed var(--point);outline-offset:2px}

.nmainl{display:grid;grid-auto-rows:auto;align-content:start;gap:18px;min-height:0;overflow:auto}
.ny{display:inline-flex;align-items:center;gap:8px;font-size:11px!important;color:var(--ink)!important;font-variant-numeric:tabular-nums}
.ny button{padding:2px 3px;display:inline-grid;place-items:center}
.nchart{display:grid;gap:2px}
.nmainl:has(.ncals){display:flex;flex-direction:column;overflow:auto}
.nsec.ncals{flex:1 1 auto;min-height:260px;grid-template-rows:auto minmax(0,1fr)}
.nhead b.ny{font-size:15px!important;gap:10px}
.ncal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:var(--hair) solid var(--line);border-left:var(--hair) solid var(--line)}
.ncd{font-size:9px;letter-spacing:.12em;color:var(--soft);text-align:center;padding:4px 0;border-right:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line)}
.ncc{container-type:inline-size;min-height:42px;border-right:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line);padding:3px 4px;display:grid;grid-template-rows:auto 1fr;min-width:0}
.ncc.out{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--wash) 6px 7px)}
.ncc .n{font-size:10px;font-variant-numeric:tabular-nums;color:var(--soft)}
.ncc.has .n{color:var(--ink)}
.ncc.today{background:color-mix(in srgb,var(--point) 5%,var(--bg))}
.ncc.today .n{text-decoration:underline;text-decoration-color:var(--point);text-underline-offset:2px;font-weight:600;color:var(--ink)}
.ncc .ne{display:grid;gap:2px;align-content:start;min-width:0;overflow:hidden}
.ncc .ne button{display:flex;align-items:center;gap:3px;min-width:0;padding:1px 0;text-align:left}
.ncc .ne .ei{font-size:13px;line-height:1;flex:none}
.ncc .ne .et{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ncc .ne button:hover .et{text-decoration:underline}
@container (max-width:60px){.ncc .ne .et{display:none}}
.ncc .ne i{font-style:normal;font-size:9px;color:var(--soft)}
.nbar{display:grid;grid-template-columns:52px minmax(0,1fr) 24px;gap:10px;align-items:center;padding:3px 0;text-align:left}
.nbar:hover .nbl{text-decoration:underline;text-underline-offset:3px}
.nbl{font-size:12.5px}
.nbt{height:7px;background:var(--wash);position:relative}
.nbt i{position:absolute;left:0;top:0;bottom:0;background:var(--point)}
.nbn{font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.nchartf{font-size:10.5px;letter-spacing:.06em;color:var(--soft);text-align:right}
.nsec{display:grid;gap:8px;min-width:0}
.rscroll{display:grid;grid-auto-flow:column;grid-auto-columns:160px;justify-content:start;gap:0;overflow-x:auto;background:transparent;border-top:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line);border-left:var(--hair) solid var(--line);scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}
.rscroll::-webkit-scrollbar{display:none}
.ncard{position:relative;background:var(--bg);min-height:128px;display:grid;scroll-snap-align:start;min-width:0}
.nmain{text-align:left;padding:12px 12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.nmain:hover{background:var(--wash)}
.nmain .nd{font-size:10.5px;letter-spacing:.06em;color:var(--soft);font-variant-numeric:tabular-nums}
.nmain .nn{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nmain .tg{font-size:11px;color:var(--soft)}
.ncard .ontg{position:absolute;top:10px;right:10px;background:var(--bg)}
.ncard .ontg.on{background:var(--point)}
.cgrid{display:grid;align-content:start;align-self:start;min-height:0;overflow:hidden;border-top:var(--hair) solid var(--line);border-left:var(--hair) solid var(--line)}
.cgrid > .ncard{border-right:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line)}
.cgrid:empty{border:0}
.nbody{width:100%;min-height:160px;border:0;border-top:var(--hair) solid var(--line);background:transparent;resize:none;font:inherit;font-size:13.5px;line-height:1.7;padding:12px 0;color:var(--ink);overflow:auto}
.nbody:focus{outline:none}
.nbhint{font-size:11px;margin:4px 0 0}
.rscroll .ncard{aspect-ratio:auto;min-height:0;height:104px;border-right:var(--hair) solid var(--line)}
.nmainl .nhead{border-bottom:0}
.toc{width:min(78%,250px);margin:0 auto;display:grid;align-content:start;gap:28px;min-height:0;overflow:auto;padding:6px 0 8px}
.toc-title{text-align:center;font-size:11px;letter-spacing:.42em;text-transform:uppercase;padding-bottom:22px;margin:0 auto;width:60%;display:grid;gap:10px}
.toc-yr{display:flex;align-items:center;justify-content:center;gap:18px}
.toc-yr button{padding:6px;display:inline-grid;place-items:center}
.toc-yr button svg{width:9px;height:9px}
.toc-y{font-size:30px;letter-spacing:.04em;font-weight:700;text-transform:none}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.toc li button{display:grid;grid-template-columns:auto auto minmax(20px,1fr) auto;align-items:baseline;gap:10px;width:100%;text-align:left}
.toc .tn{font-size:10.5px;letter-spacing:.1em;color:var(--soft);font-variant-numeric:tabular-nums}
.toc .tc{font-size:17px;font-weight:600}
.toc .tl{border-bottom:1px dotted var(--soft);transform:translateY(-4px)}
.toc .tp{font-size:13px;font-variant-numeric:tabular-nums}
.toc li button:hover .tc{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.toc .tt{font-size:11px;color:var(--soft);padding-left:30px;margin-top:2px}
.catlist{display:grid;align-content:start;border-top:var(--hair) solid var(--line)}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 18px;gap:12px;align-items:baseline;padding:14px 2px;border-bottom:var(--hair) solid var(--line);text-align:left}
.catrow:hover{background:var(--wash)}
.catrow b{font-size:16px}
.catrow .tags{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .cnt{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.back{font-size:20px;line-height:1;margin-right:2px}
.mk-one{font-size:12px;border:var(--hair) solid var(--line);padding:5px 10px}
.mk-one.on{background:var(--point);color:var(--bg)}
.pgb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.setcol{display:grid;align-content:start;gap:22px;min-height:0;overflow:auto}
.setcol section{display:grid;gap:10px}
.setcol .setrow{padding:12px 0}
.setcol .setrow p{margin:2px 0 0}
.setcol .setrow b{font-size:15px}
.pgc{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--point);padding:10px 12px;font-size:13px;background:color-mix(in srgb,var(--point) 5%,var(--bg))}
.pgc span{margin-right:auto}

/* week review */
.rvwrap{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-height:0}
.mgrid.rv{min-height:0}
.rvtop{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.rvdow{font-size:9.5px}
.rvhd2{font-variant-numeric:tabular-nums}
.rvhd2 button{font:inherit;letter-spacing:inherit;padding:0}
.rvhd2 button:hover{text-decoration:underline;text-underline-offset:3px}
.rvhd2.today button{text-decoration:underline;text-decoration-color:var(--point);text-underline-offset:3px;font-weight:700}
.ph .sub.rvsub{color:color-mix(in srgb,var(--ink) 72%,var(--bg));font-weight:400}
.rvl{font-size:8.5px!important}
.rvc{position:relative;padding:4px 6px;min-height:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr)}
.rvc.rvh,.rvc.rvs{grid-template-rows:none}
.rvc.today{background:color-mix(in srgb,var(--point) 5%,var(--bg))}
.rvc.dirty::after{content:"";position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--point)}
.rvh{grid-template-columns:auto 1fr;align-items:baseline;gap:6px;padding:6px 6px 5px}
.rvh .n{font-size:17px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;padding:0;text-align:left}
.rvh .n:hover{text-decoration:underline;text-underline-offset:3px}
.rvh.today .n{text-decoration:underline;text-decoration-color:var(--point);text-underline-offset:3px;font-weight:600}
.rvh span{font-size:9.5px;letter-spacing:.16em;color:var(--soft)}
.rvs{font-size:10.5px;line-height:1.35;font-variant-numeric:tabular-nums;color:var(--soft);align-content:center}
.rvs b{font-size:12px;font-weight:500;color:var(--ink)}
.rvl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);padding:6px 4px;line-height:1.2}
.rvb{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:6px}
.rvb .fld textarea{flex:1}
.rvsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;padding-bottom:0}
.rvsplit > *{min-height:0;display:flex;flex-direction:column;gap:4px;padding:2px 12px 6px 0}
.rvsplit > * + *{border-left:var(--hair) solid var(--line);padding-left:12px;padding-right:0}
.rvnotes .dnotes{overflow:auto;min-height:0;display:grid;align-content:start;gap:4px}
.rvnotes .nd{font-size:10.5px;color:var(--soft);font-variant-numeric:tabular-nums;margin-right:2px}
.hlink{text-align:left;padding:0;cursor:pointer}
.hlink:hover span{text-decoration:underline;text-underline-offset:3px}
.hc.hi{font-size:15px;line-height:1}
.hc.hi::after{display:none}
.hright{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:18px;min-height:0;overflow:auto;align-content:start}
.hsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;border-bottom:var(--hair) solid var(--line);padding:14px 0}
.hsum .hst b{font-size:22px}
.hsum .hst b.sm i{font-style:normal;font-weight:400;color:var(--soft);font-size:12px;margin-left:2px}
.hsum .hst b.sm{font-size:13.5px;font-weight:500;line-height:1.3;padding-top:4px}
.hheat{display:grid;gap:8px;align-content:start}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px}
.hx{aspect-ratio:1/1;background:var(--wash);border-radius:1px}
.hx.out{background:transparent}
.hx.l0{background:color-mix(in srgb,var(--point) 8%,var(--bg))}
.hx.l1{background:color-mix(in srgb,var(--point) 25%,var(--bg))}
.hx.l2{background:color-mix(in srgb,var(--point) 45%,var(--bg))}
.hx.l3{background:color-mix(in srgb,var(--point) 70%,var(--bg))}
.hx.l4{background:var(--point)}
.hx.today{outline:1px solid var(--point);outline-offset:1px}
.heatm{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));font-size:9px;letter-spacing:.08em;color:var(--soft)}
.hicbtn{width:24px;height:24px;font-size:14px;display:grid;place-items:center;border:var(--hair) solid var(--faint);padding:0}
.hicbtn[aria-expanded="true"]{border-color:var(--point)}

<script>
/* 설치 안내는 이 파일 맨 앞 주석에 있어요. */
/* ===================== Notion connection (all IDs in one place) =====================
   Reads use each DB's saved view "Diary Book" (view mode, 100 rows per call, start_cursor to continue). */
/* 설치할 때 고르는 것. tabs: 쓸 화면(Day는 항상 포함) · events: 일정 가져올 곳 "gcal"(구글 캘린더) | "notion" · photos: 사진 기능 */
const KIT={tabs:["year","month","week","day","notes","habit"],events:"gcal",photos:true};
/* 설치할 때 Claude가 이곳에 내 노션 DB의 저장된 뷰 URL과 데이터 소스 ID를 채워요. 비어 있으면 설치 전 안내만 보여요. */
const NOTION={
  server:"Notion",
  diary:  {view:"",ds:"",template:""},
  planner:{view:"",ds:"",weekTemplate:"",monthTemplate:""},
  notes:  {view:"",ds:""},
  habits: {view:"",ds:""},
  hlog:   {view:"",ds:""},
  goals:  {view:"",ds:""} // 키트에서는 쓰지 않아요
};
for(const k in NOTION){const v=NOTION[k];if(v&&typeof v==="object"&&v.ds)v.ds=String(v.ds).trim().replace(/^collection:\/\//,"");}
const DEMO=!NOTION.diary.view;
const TABS_ON=new Set(DEMO?["year","month","week","day","notes","habit"]:["day",...(KIT.tabs||[])]);
const USE={planner:["year","month","week"].some(v=>TABS_ON.has(v)),notes:TABS_ON.has("notes"),habits:TABS_ON.has("habit")};
const APP="kit"; // "diary" | "planner" — 같은 코드로 다이어리북과 플래너를 만들어요
const DIARY_F=["Morning Note","Event","To do","Log","Joy","Reset","Tomorrow","Sleep Journal","Wake Up","In Bed","Comment"];
const PLAN_F=["Goal","Period Log","Comment"];
const store={diary:{},week:{},month:{},notes:[],ci:[],habits:[],hlog:{},goals:[]};
let MCP=null;
const NET={state:"idle",msg:"",loadedAt:null,counts:{},busy:0};
let SAVING=false,CREATING=false,CREATE_BLOCKED=false,HADDING=false;
const BODY={}; // pageId -> {s:"loading"|"ok"|"blocked"|"error", why}

/* --- Notion text <-> plain text --- */
const pid=u=>{const m=/([0-9a-f]{32})/.exec(String(u||"").replace(/-/g,""));return m?m[1]:"";};
const nurl=id=>"https://www.notion.so/"+id;
function txt(v){if(v==null)return"";return String(v).replace(/^\s*<p>\s*/i,"").replace(/\s*<\/p>\s*$/i,"").replace(/\s*<\/p>\s*<p>\s*/gi,"\n").replace(/<br\s*\/?>/g,"\n").replace(/\\([\\*~`$\[\]<>{}|^])/g,"$1");}
function out(v){return String(v).replace(/\\/g,"\\\\").replace(/([$\[\]<>{}|^])/g,"\\$1").replace(/\r?\n/g,"<br>");}
function pkey(n){return /^(id|url)$/i.test(n)?"userDefined:"+n:n;}
function bodyIn(c){return String(c||"").split("\n").map(l=>l.trim()==="<empty-block/>"?"":l).join("\n").replace(/<br\s*\/?>/g,"\n");}
function bodyOut(t){const s=String(t).replace(/\r/g,"");return s.trim()?s.split("\n").map(l=>l.trim()===""?"<empty-block/>":l).join("\n"):"<empty-block/>";}
const NON_TEXT=/<(image|video|audio|file|pdf|embed|table|columns|column|page|database|callout|details|synced_block|synced_block_reference|meeting-notes|unknown|custom-block|tabs|tab|folder|table_of_contents)\b|!\[|^\s*\$\$/m;

/* --- connector calls --- */
function errCode(e){return (e&&e.code)||"upstream_error";}
function errMsg(e){const c=errCode(e);
  if(c==="no_mcp"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed")return"Notion 연결을 쓸 수 없어요. Claude 앱이나 claude.ai에서 열었는데도 이렇게 보이면, 설치한 대화에서 「아티팩트에 노션 사용 권한을 설정해 줘」라고 말해 주세요.";
  if(c==="needs_reauth")return"Notion 연결이 만료됐어요. claude.ai 설정 › 커넥터에서 Notion을 다시 연결해 주세요.";
  if(c==="server_not_connected"||c==="server_not_found")return"Notion 커넥터가 없어요. claude.ai 설정 › 커넥터에서 Notion을 추가해 주세요.";
  if(c==="selection_required")return"Notion 커넥터가 여러 개예요. claude.ai가 띄우는 선택 창에서 하나를 골라 주세요.";
  if(c==="approval_required"||c==="not_in_manifest"||c==="consent_required")return"이 아티팩트가 Notion을 쓰도록 허용해야 해요. 아래 버튼을 누르면 허용 창이 떠요.";
  if(c==="blocked_by_policy")return"조직 정책으로 이 Notion 도구를 쓸 수 없어요.";
  if(c==="server_unavailable"||c==="rate_limited")return"Notion이 잠시 응답하지 않아요. 조금 뒤 다시 시도해 주세요.";
  if(c==="tool_error"){let m=e.message||"";try{const j=JSON.parse(m);m=(j.error&&(j.error.message||j.error.code))||m;}catch(_){}return"Notion이 요청을 거절했어요: "+String(m).slice(0,180);}
  return"Notion 요청이 실패했어요"+(e&&e.message?": "+String(e.message).slice(0,160):".");}
async function tool(name,input,retry){

function rec(key){const[k,id]=key.split(/:(.+)/);if(k==="diary")return store.diary[id];if(k==="week")return store.week[id];if(k==="month")return store.month[id];if(k==="habit")return store.habits.find(h=>h.id===id);if(k==="hlog")return store.hlog[id];if(k==="goal")return(store.goals||[]).find(g=>g.id===id);if(k==="note"){const n=store.notes.find(x=>x.id===id);return n?{On:n.on?"__YES__":"__NO__",Body:n.body||""}:null;}return null;}

/* save: only changed properties, one page at a time; stop at the first failure */
async function saveAll(){
  if(SAVING)return;const keys=dirtyKeys();if(!keys.length)return;SAVING=true;$("save").disabled=true;$("save").textContent="저장 중…";let done=0,failed=null;
  for(const k of keys){const[kind,id]=k.split(/:(.+)/);const r=rec(k);const fields=Object.keys(drafts[k]||{}).filter(f=>isDirty(k,f));if(!fields.length){delete drafts[k];continue;}
    let page=null,props={},body=null;
    if(kind==="note"){const n=store.notes.find(x=>x.id===id);page=n&&n.id;}
    else if(kind==="habit"){page=r&&r.id;}
    else page=r&&r.id;
    try{
      if(!page)throw{code:"no_page",message:"노션 페이지를 찾지 못했어요. 다시 불러온 뒤 시도해 주세요."};
      for(const f of fields){const v=drafts[k][f];
        if(f==="Body"){if(!BODY[page]||BODY[page].s==="error")await loadBody(page);if(!BODY[page]||BODY[page].s!=="ok")throw{code:"body_locked",message:"본문을 아직 불러오지 않았거나 글만 있는 페이지가 아니에요."};body=v;continue;}
        if(kind==="note"||kind==="habit"){
          if(f==="On"){props.On=v==="__YES__"?"__YES__":"__NO__";continue;}
          if(f==="Order"){const n=parseFloat(v);props.Order=isNaN(n)?null:n;continue;}
          if(f==="Start"){props["date:Start:start"]=v||null;props["date:Start:is_datetime"]=0;continue;}
          if(f==="Category"){props.Category=v||null;continue;}
          props[pkey(f)]=v===""?null:out(v);continue;}
        if(kind==="goal"){if(f==="Project"){props.Project=v==="__YES__"?"__YES__":"__NO__";continue;}if(f==="마감기한"){props["date:마감기한:start"]=v||null;if(v)props["date:마감기한:is_datetime"]=0;}else if(["상태","시간 지평","성격","카테고리"].includes(f))props[f]=v||null;else props[f]=v===""?(f==="목표"?"":null):out(v);continue;}
        if(kind==="hlog"&&/ 절반$/.test(f)){props[pkey(f)]=v?"절반":null;continue;}
        if(kind==="hlog"){props[pkey(f)]=v==="__YES__"?"__YES__":"__NO__";continue;}
        props[pkey(f)]=v===""?null:out(v);}
      if(Object.keys(props).length)await tool("notion-update-page",{page_id:page,command:"update_properties",properties:props});
      if(body!==null)await tool("notion-update-page",{page_id:page,command:"replace_content",new_str:bodyOut(body)});
      if(kind==="note"){const n=store.notes.find(x=>x.id===id);if("On" in drafts[k])n.on=drafts[k].On==="__YES__";if("Body" in drafts[k])n.body=drafts[k].Body;}
      else Object.assign(r,drafts[k]);
      delete drafts[k];done++;
    }catch(e){failed={k,page,e};break;}}
  SAVING=false;$("save").disabled=false;$("save").textContent="노션에 저장";updateSave();draw();
  if(failed){const left=dirtyKeys().length;const m=failed.e&&failed.e.code&&!["no_page","body_locked"].includes(failed.e.code)?errMsg(failed.e):(failed.e&&failed.e.message)||errMsg(failed.e);
    sheet(`<div class="sheet-head"><h2>저장이 멈췄어요</h2><button class="ghost" data-close>닫기</button></div>
      <p><b>${esc(keyLabel(failed.k))}</b> 페이지에서 실패했어요.</p><p class="muted">${esc(m)}</p>
      <p class="muted">${done?`앞의 ${done}건은 노션에 저장됐어요. `:""}남은 ${left}건은 저장하지 않고 그대로 두었어요. 문제를 해결한 뒤 다시 「노션에 저장」을 눌러 주세요.</p>
      ${failed.page?`<p><a href="${nurl(failed.page)}" target="_blank" rel="noopener">노션에서 이 페이지 열기 ↗</a></p>`:""}`);}
  else toast(`노션에 저장했어요 (${done}건)`);
}

async function loadBody(page){
  if(!page||(BODY[page]&&BODY[page].s!=="error"))return;BODY[page]={s:"loading"};
  try{const p=await tool("notion-fetch",{id:page},true);const t=(p&&p.text)||"";const m=/<content>\n?([\s\S]*?)\n?<\/content>/.exec(t);const c=m?m[1]:"";
    const blocked=(p&&(p.truncated||p.unknown_block_count))||NON_TEXT.test(c);
    BODY[page]=blocked?{s:"blocked"}:{s:"ok"};return bodyIn(c);}
  catch(e){BODY[page]={s:"error",why:errMsg(e)};return null;}
}

  if(b.s==="error")return b.why||"본문을 불러오지 못했어요.";return"";}

function bodyHTML(text){const o=[];let first=true;

    if(/^(-{3,}|—-+|—{2,}|\*{3,})$/.test(l)){if(o.length&&o[o.length-1]!=="<hr>")o.push("<hr>");first=true;continue;}

const EV_TIME=/^(\d{1,2}:\d{2}(?:\s*[-~–]\s*\d{1,2}:\d{2})?)\s*\|?\s*/;
const evName=l=>String(l).replace(/^\s*◦\s*/,"").replace(EV_TIME,"").trim();
const evHasTime=l=>EV_TIME.test(String(l).replace(/^\s*◦\s*/,""));
function evPrefix(l){const m=/^(\s*◦?\s*(?:\d{1,2}:\d{2}(?:\s*[-~–]\s*\d{1,2}:\d{2})?\s*\|?\s*)?)/.exec(l);let p=m?m[1]:"";if(!/^\s*◦/.test(p))p="◦ "+p.trimStart();return p;}
function evShow(v){return String(v||"").split("\n").filter(l=>l.trim()).map(l=>"◦ "+evName(l)).join("\n");}
function evMerge(orig,edited){const O=String(orig||"").split("\n").filter(l=>l.trim()),used=new Set();
  return String(edited).split("\n").map((l,i)=>{const nm=evName(l);if(!nm)return null;
    let j=O.findIndex((o,x)=>!used.has(x)&&evName(o)===nm);if(j<0&&i<O.length&&!used.has(i)&&evHasTime(O[i]))j=i;
    if(j>=0){used.add(j);return evPrefix(O[j])+nm;}return"◦ "+nm;}).filter(x=>x!==null).join("\n");}
function bindMonthEv(){for(const el of document.querySelectorAll("[data-mev]")){const k=el.dataset.mev;const base=val(k,"Event");
  el.oninput=()=>{setDraft(k,"Event",evMerge(base,el.value));const c=el.closest(".mcell");if(c)c.classList.toggle("dirty",isDirty(k,"Event"));};
  el.onblur=()=>{const v=evShow(val(k,"Event"));if(evShow(el.value)!==el.value&&el.value.trim())el.value=v;};}}

/* ===================== PAGES (coverage & creation, sample) ===================== */
function lastKey(o){const k=Object.keys(o).sort();return k.length?k[k.length-1]:null;}
function wTitle(ws){return isoWeekYearOf(addDays(ws,WSTART))+" Week "+wno(ws,WSTART);}
function isoWeekYearOf(s){const d=parse(s);const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()+3-((d.getDay()+6)%7));return t.getFullYear();}
function planList(k){
  const t=todayStr(),y=parse(cursor).getFullYear();const dl=lastKey(store.diary),wl=lastKey(store.week),ml=lastKey(store.month);const out=[];
  if(k[0]==="d"||k[0]==="h"){const S=k[0]==="h"?store.hlog:store.diary,L=lastKey(S),q=k.slice(1);
    if(q==="gap"){const k0=Object.keys(S).sort()[0];if(!k0)return out;for(let d=k0>y+"-01-01"?k0:y+"-01-01";d<=(L&&L<y+"-12-31"?L:y+"-12-31");d=addDays(d,1))if(!S[d])out.push(d);return out;}
    let f=L?addDays(L,1):t;const to=q==="7"?addDays(f,6):q==="30"?addDays(f,29):parse(f).getFullYear()+"-12-31";for(let d=f;d<=to;d=addDays(d,1))if(!S[d])out.push(d);return out;}
  if(k[0]==="w"){let ws=wl?addDays(weekStart(wl),7):weekStart(t);const end=k==="w4"?addDays(ws,27):parse(ws).getFullYear()+"-12-31";for(;ws<=end;ws=addDays(ws,7))if(!weekKey(ws))out.push(ws);return out;}
  let d=ml?parse(ml+"-01"):parse(t.slice(0,8)+"01");if(ml)d.setMonth(d.getMonth()+1);const endY=d.getFullYear();
  for(let i=0;i<(k==="m3"?3:12);i++){if(k!=="m3"&&d.getFullYear()>endY)break;const ym=fmt(d).slice(0,7);if(!store.month[ym])out.push(ym);d.setMonth(d.getMonth()+1);}return out;
}
/* 한 번에 만들기: 오늘부터 올해 말까지(10월부터는 내년 말까지) Diary · Habit · Weekly · Monthly를 모두 */
function allLists(){const t=todayStr(),EY=+t.slice(0,4)+(+t.slice(5,7)>=10?1:0),end=EY+"-12-31",o={diary:[],hlog:[],week:[],month:[],EY};
  for(let d=t;d<=end;d=addDays(d,1)){if(!store.diary[d])o.diary.push(d);if(USE.habits&&!store.hlog[d])o.hlog.push(d);}
  if(USE.planner)for(let ws=weekStart(t);ws<=end;ws=addDays(ws,7))if(!weekKey(ws))o.week.push(ws);
  const m=parse(t.slice(0,8)+"01");while(USE.planner&&m.getFullYear()<=EY){const ym=fmt(m).slice(0,7);if(!store.month[ym])o.month.push(ym);m.setMonth(m.getMonth()+1);}
  o.total=o.diary.length+o.hlog.length+o.week.length+o.month.length;return o;}
async function createAll(o){let done=0;for(const k of["diary","hlog","week","month"]){if(!o[k].length)continue;await createPages(k,o[k]);if(CREATE_BLOCKED)return;done+=o[k].length;}
  if(done)toast(`${o.EY}년 말까지 페이지를 모두 만들었어요`);}
function createLocked(){return CREATING||CREATE_BLOCKED||!MCP||NET.busy>0;}
async function createPages(kind,list){

  if(!MCP){toast(errMsg({code:"no_mcp"}));return;}
  if(NET.busy){toast("노션에서 다 불러온 뒤에 만들 수 있어요. 잠시만 기다려 주세요");return;}
  const have=v=>kind==="diary"?!!store.diary[v]:kind==="hlog"?!!store.hlog[v]:kind==="week"?!!weekKey(v):!!store.month[v];
  const todo=[...new Set(list)].filter(v=>!have(v));

  CREATING=true;draw();
  const dsId=kind==="diary"?NOTION.diary.ds:kind==="hlog"?NOTION.hlog.ds:NOTION.planner.ds;
  const tpl=kind==="diary"?NOTION.diary.template:kind==="week"?NOTION.planner.weekTemplate:kind==="month"?NOTION.planner.monthTemplate:null;
  const mk=v=>{let p;
    if(kind==="week")p={Title:wTitle(v),Category:"Week","date:Date:start":v,"date:Date:is_datetime":0};
    else if(kind==="month")p={Title:v,Category:"Month","date:Date:start":v+"-01","date:Date:is_datetime":0};
    else p={Title:v,"date:Date:start":v,"date:Date:is_datetime":0};
    const o={properties:p};if(tpl)o.template_id=tpl;return o;};
  const loaders=kind==="diary"?["diary"]:kind==="hlog"?["hlog"]:["planner"];
  let made=0;
  try{
    for(let i=0;i<todo.length;i+=10){const chunk=todo.slice(i,i+10);
      setNet("loading",`노션에 ${({diary:"Diary",hlog:"Habit",week:"Weekly",month:"Monthly"})[kind]} 페이지 만드는 중… ${Math.min(i+10,todo.length)}/${todo.length}`);
      await tool("notion-create-pages",{parent:{data_source_id:dsId},pages:chunk.map(mk),allow_async:false});made+=chunk.length;}

yearMode=APP==="diary"?"log":"goal"; // 다이어리 Year = Period Log, 플래너 Year = Goal
const APP_TABS=APP==="kit"?[["year","Year"],["month","Month"],["week","Week"],["day","Day"],["notes","Notes"],["habit","Habit"]].filter(([v])=>TABS_ON.has(v)):APP==="planner"?[["today","Today"],["year","Year"],["goal","Goal"],["plan","Plan"],["project","Project"],["habit","Habit"]]:[["year","Year"],["month","Month"],["week","Week"],["day","Day"],["notes","Notes"]];
(()=>{const nav=$("tabs"),set=nav.querySelector(".set-tab");nav.querySelectorAll("[data-v]:not(.set-tab)").forEach(b=>b.remove());for(const[v,l]of APP_TABS){const b=document.createElement("button");b.dataset.v=v;b.textContent=l;nav.insertBefore(b,set);}
  if(view!=="settings"&&!APP_TABS.some(t=>t[0]===view))view=APP==="planner"?"today":"day";})();
for(const b of document.querySelectorAll("#tabs [data-v]"))b.onclick=()=>go(b.dataset.v);
$("today-tab").onclick=()=>{cursor=todayStr();if(APP==="planner"){planYM=todayStr().slice(0,7);go("today");}else go("day");};
try{document.documentElement.style.setProperty("--hair",(1/Math.min(Math.max(window.devicePixelRatio||1,1),3))+"px");}catch(e){}
$("save").onclick=saveAll;
$("discard").onclick=()=>{for(const k in drafts)delete drafts[k];for(const k in DBASE)delete DBASE[k];updateSave();draw();};
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!single())side=0;draw();},150);});
draw();
if(DEMO){
/* 설치 전: 노션이 연결되지 않은 상태라 다이어리 대신 안내만 보여요. */
const pre=document.createElement("div");pre.className="preinstall";
pre.innerHTML=`<div class="pre-box"><h1>Diary Book</h1><p>아직 내 노션에 연결되지 않았어요.</p><p class="muted">노션 안내 페이지의 「설치 문장」과 함께 이 파일을 Claude에게 보내면 설치돼요.</p></div>`;
document.body.appendChild(pre);
}else (async()=>{
  const C=window.claude;if(!C||!C.use){setNet("error",errMsg({code:"no_mcp"}));return;}
  if(PHOTOS)C.use("assets").then(a=>{PH.assets=a;softDraw();}).catch(()=>{});
  if(PHOTOS)Promise.all([C.use("db").catch(()=>null),C.use("user").catch(()=>null)]).then(async([db,u])=>{PH.db=db;PH.user=u;if(u){try{PH.uid=await u.id();}catch(_){}}
    if(db&&PH.uid)db.collection("data/users/"+PH.uid).onSnapshot(sn=>{const m={};for(const x of sn.docs){if(!x.id.startsWith("photos_"))continue;const v=x.data()||{};if(Array.isArray(v.ids)&&v.ids.length)m[x.id.slice(7)]=v.ids;}PH.map=m;softDraw();refreshViewer();},()=>{});
    softDraw();});
  MCP=await C.use("mcp");
  if(!MCP){setNet("error",errMsg({code:"no_mcp"}));draw();return;}
  loadAll();
})();
</script>
